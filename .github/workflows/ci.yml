name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The language must behave identically on every Node we claim to support and
  # on every OS. The conformance goldens are byte-compared, so any host-specific
  # output would fail here rather than in someone's editor.
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '20' }
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '22' }
          - { os: windows-latest, node: '22' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node scripts/run-tests.mjs

      # The language's own test suite, written in Lumen and run by `lumen test`.
      # This exercises the CLI end to end on every supported platform.
      - name: Lumen test suite
        run: node packages/cli/dist/index.js test tests/lumen
        env:
          LUMEN_AI_PROVIDER: mock

  # `tsc --build` already type-checks, but forcing a clean rebuild catches
  # errors that incremental output would otherwise hide.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Run every example through the real CLI. This is the fastest signal that
  # something user-visible broke.
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run examples
        run: node scripts/run-examples.mjs
        env:
          LUMEN_AI_PROVIDER: mock

      # The stdlib reference is generated from the modules themselves, so it
      # cannot silently drift from what the library actually exports.
      - name: Check the generated docs are current
        run: node scripts/gen-stdlib-docs.mjs --check

      # `--check` writes nothing. It names the files and exits non-zero, so the
      # fix is `lumen fmt .` rather than reading a diff of invisible characters.
      - name: Check every .lm file is formatted
        run: node packages/cli/dist/index.js fmt --check .

      # The counts on the README's front page, and that every example and every
      # standard module is actually documented. A hand-written count goes stale
      # the moment somebody adds a file.
      - name: Check the README matches the repository
        run: node scripts/check-counts.mjs

  # The whole point of the project: Lumen runs on its own. This job re-proves it
  # on every pull request, in the two ways a user can actually get it. The
  # portable bundle has to run from a directory that contains nothing but itself,
  # and the native binary has to run with node unreachable. If either tier
  # quietly regrows a dependency on node_modules, on the source tree, or on an
  # installed runtime, it fails here instead of on someone's laptop.
  distribution:
    name: runs without node or node_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Tier 2: one CommonJS file for a machine that has some Node and nothing else.
      - name: Build the portable bundle
        run: npm run bundle

      # Copy ONLY the bundle and one example to a fresh directory outside the
      # checkout, then run it there. No package.json, no node_modules, no Lumen
      # sources are within reach. If the bundle needs any of them, this is the
      # step that says so.
      - name: The portable bundle is self-contained
        run: |
          set -euo pipefail
          sandbox="$RUNNER_TEMP/portable"
          rm -rf "$sandbox"
          mkdir -p "$sandbox"
          cp build/lumen.cjs "$sandbox/"
          cp examples/hello.lm "$sandbox/"
          cd "$sandbox"
          echo "contents of $sandbox:"
          ls -A
          output="$(node lumen.cjs run hello.lm)"
          echo "$output"
          test "$output" = 'Hello from Lumen!'

      # Bun compiles the native binary. It is a build-time tool only: nothing a
      # user of the binary ever needs, which is what the last step demonstrates.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Tier 1: a true standalone executable with a JavaScript runtime inside it.
      - name: Build the native binary
        run: npm run binary

      - name: The native binary runs
        run: ./build/lumen run examples/hello.lm

      # The real proof. `env -i` hands the process an empty environment and PATH
      # points at a directory that does not exist, so no `node` can be found by
      # any means. A binary that still prints the right answer needs no runtime
      # installed at all. The first half asserts node really is gone, so that a
      # future runner change cannot turn this into a test that proves nothing.
      - name: The native binary runs with node unreachable
        run: |
          set -euo pipefail
          if env -i PATH=/nonexistent node --version >/dev/null 2>&1; then
            echo 'node is still reachable with PATH=/nonexistent; this check would prove nothing' >&2
            exit 1
          fi
          output="$(env -i PATH=/nonexistent HOME=/tmp ./build/lumen run examples/hello.lm)"
          echo "$output"
          test "$output" = 'Hello from Lumen!'

      # tests/unit/distribution.test.ts makes the same claims in far more
      # detail — it compares both artefacts byte for byte against the ordinary
      # CLI, including a program that imports the standard library. It skips
      # itself wherever the artefacts do not exist, which is every other job, so
      # this is the one place in CI where it can actually run. Running it here
      # keeps the suite from quietly being dead weight.
      - name: Distribution test suite, with both artefacts present
        run: node --test tests/dist/unit/distribution.test.js

  # This repository is proprietary. Every package is marked private, and this
  # job fails if that ever stops being true, so an accidental `npm publish`
  # cannot be the thing that discovers it.
  private:
    name: packages stay private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every package.json is private
        run: node scripts/check-private.mjs
